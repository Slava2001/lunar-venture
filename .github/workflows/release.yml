name: Release

on:
  push:
    tags:
    - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  BIN_NAME: lunar-venture
  PROJECT_NAME: lunar-venture
  
jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build: [x86_64-linux, x86_64-macos, x86_64-windows, wasm]
        include:
        - build: x86_64-linux
          os: ubuntu-latest
          rust: stable
          target: x86_64-unknown-linux-gnu
          cross: false
        - build: x86_64-macos
          os: macos-latest
          rust: stable
          target: x86_64-apple-darwin
          cross: false
        - build: x86_64-windows
          os: windows-latest
          rust: stable
          target: x86_64-pc-windows-msvc
          cross: false
        - build: wasm
          os: ubuntu-latest
          rust: stable
          target: wasm32-unknown-unknown
          cross: true
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2
        with:
          submodules: true
      - name: Install ${{ matrix.rust }} toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
      - name: Build release binary
        uses: actions-rs/cargo@v1
        with:
          use-cross: ${{ matrix.cross }}
          command: build
          args: --release --locked --target ${{ matrix.target }}
      - name: Strip release binary (linux and macos)
        if: matrix.build == 'x86_64-linux' || matrix.build == 'x86_64-macos'
        run: strip "target/${{ matrix.target }}/release/$BIN_NAME"
      - name: Build archive
        shell: bash
        run: |
          mkdir dist
          ext=""
          if [ "${{ matrix.build }}" = "x86_64-windows" ]; then
            ext=".exe"
          elif [ "${{ matrix.build }}" = "wasm" ]; then
            ext=".wasm"
          fi
          cp "target/${{ matrix.target }}/release/$BIN_NAME${ext}" "dist/"
          chmod +x "dist/$BIN_NAME${ext}"
      - uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.build }}
          path: dist
  publish:
    name: Publish
    needs: [build]
    runs-on: ubuntu-latest
    steps:
        - name: Checkout sources
          uses: actions/checkout@v2
          with:
            submodules: false
        - uses: actions/download-artifact@v4
          with:
            path: ./artifact
        - name: Show artifact
          run: ls -al ./artifact/*
        - name: Calculate tag name
          id: tagname
          run: |
            name=""
            if [[ $GITHUB_REF == refs/tags/v* ]]; then
              name=${GITHUB_REF:10}
            fi
            echo "TAG=${name}" >> $GITHUB_OUTPUT
            echo TAG=$name >> $GITHUB_ENV
        - name: Build archive
          shell: bash
          run: |
            set -ex
            shopt -s nullglob
            rm -rf dist
            mkdir dist
            cd ./artifact
            for dir in ./* ; do
                platform=${dir#"./bins-"}
                pkgname=$PROJECT_NAME-$TAG-$platform
                if [[ $platform =~ "windows" ]]; then
                    7z a -r ../dist/$pkgname.zip $dir/*
                else
                    tar -czvf ../dist/$pkgname.tar.gz --directory=$dir
                fi
            done
        - name: Upload binaries to release
          uses: svenstaro/upload-release-action@v2
          with:
            repo_token: ${{ secrets.GITHUB_TOKEN }}
            file: ./dist/*
            file_glob: true
            tag: ${{ steps.tagname.outputs.TAG }}
            overwrite: true
